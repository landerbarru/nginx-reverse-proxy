services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/web:/usr/share/nginx/html:ro

  zerbitzuak:
    image: nginx:alpine
    restart: unless-stopped
    command: ["/bin/sh", "-c", "printf 'server { listen 80; root /usr/share/nginx/html; index Zerbitzuak.html; }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    volumes:
      - ./proxy/web:/usr/share/nginx/html:ro

  code:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      PASSWORD: "${CODE_PASSWORD:?Falta CODE_PASSWORD: crea el fichero .env a partir de .env.template}"
    volumes:
      - code_config:/config
      - ./:/config/workspace

  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      DUPLICATI__WEBSERVICE_PASSWORD: "${DUPLICATI_PASSWORD:?Falta DUPLICATI_PASSWORD en .env}"
      SETTINGS_ENCRYPTION_KEY: "${DUPLICATI_ENCRYPTION_KEY:?Falta DUPLICATI_ENCRYPTION_KEY en .env}"
    ports:
      - "8200:8200"
    volumes:
      - duplicati_config:/config
      - ./proxy/web:/source/web:ro
      - ./backups:/backups

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  codigoagil:
    image: nginx:alpine
    hostname: codigoagil.local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../docker/Erronka1:/usr/share/nginx/html:ro

  intranet:
    build:
      context: ./intranet
    hostname: intranet
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./intranet/index.html:/usr/share/nginx/html/index.html:ro
      - ./intranet/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  code_config:
  duplicati_config:
  portainer_data:
