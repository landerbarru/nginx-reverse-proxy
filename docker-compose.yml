# Práctica de reverse proxy: nginx en el puerto 80 reparte las peticiones entre los servicios.
#
#   docker compose up -d                       ← siempre desde esta carpeta
#     http://localhost/              → portal (proxy/web/)
#     http://localhost/code/         → code-server
#     http://localhost/portainer/    → Portainer
#
# Solo el proxy publica un puerto ("ports"). El resto de servicios no son accesibles desde fuera:
# se llega a ellos a través del proxy, que los encuentra por su nombre de servicio (code, portainer…).

services:
  proxy:                        # reverse proxy + portal
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"                 # Acceso directo en http://localhost/
      - "8080:80"               # Alternativa en http://localhost:8080/
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # la configuración
      - ./intranet:/usr/share/nginx/html:ro                    # intranet de entrada

  zerbitzuak:                   # web pública en su propio contenedor → /zerbitzuak/
    image: nginx:alpine
    restart: unless-stopped
    command: ["/bin/sh", "-c", "printf 'server { listen 80; root /usr/share/nginx/html; index Zerbitzuak.html; }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'" ]
    volumes:
      - ./proxy/web:/usr/share/nginx/html:ro

  code:                         # VS Code en el navegador → /code/
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      PASSWORD: "${CODE_PASSWORD:?Falta CODE_PASSWORD: crea el fichero .env a partir de .env.template}"
    volumes:
      - code_config:/config
      - ./:/config/workspace    # incluye proxy/web, que es el contenido servido por nginx

  duplicati:                   # copias/restauración del sitio → /duplicati/
    image: lscr.io/linuxserver/duplicati:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      DUPLICATI__WEBSERVICE_PASSWORD: "${DUPLICATI_PASSWORD:?Falta DUPLICATI_PASSWORD en .env}"
      SETTINGS_ENCRYPTION_KEY: "${DUPLICATI_ENCRYPTION_KEY:?Falta DUPLICATI_ENCRYPTION_KEY en .env}"
    ports:
      - "8200:8200"
    volumes:
      - duplicati_config:/config
      - ./proxy/web:/source/web:ro
      - ./backups:/backups

  portainer:                    # gestión de Docker desde el navegador → /portainer/
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # ↓ Añade aquí los servicios nuevos (Tarea 2 en adelante): dentro de services, antes de volumes.

volumes:
  code_config:
  duplicati_config:
  portainer_data:
